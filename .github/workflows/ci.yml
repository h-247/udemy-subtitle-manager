name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest backend/tests -q
  sites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: chatgpt-sites/udemy-subtitle-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chatgpt-sites/udemy-subtitle-manager/package-lock.json
      - run: npm run install:ci
      - run: npm run db:migrate:local
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Test production Worker with local D1 and R2
        run: npm run test:runtime
      - name: Test browser release flows
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Verify release snapshot and health provenance
        working-directory: .
        run: node scripts/test-release-snapshot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            chatgpt-sites/udemy-subtitle-manager/test-results/
            chatgpt-sites/udemy-subtitle-manager/playwright-report/
            chatgpt-sites/udemy-subtitle-manager/dist/
          include-hidden-files: true
          if-no-files-found: warn
